<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>livescope</title>
<style>
  :root { color-scheme:dark; --bg:#1c1c1e; --line:#38383a; --fg:#f2f2f7; --fg2:#c7c7cc; --dim:#98989f; --alt:#232325; --soft:#3a3a3c;
          --card:#2c2c2e; --bad:#ff6961; --mono:ui-monospace, Menlo, monospace;
          --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:12px/1.2 var(--sans); -webkit-font-smoothing:antialiased; overflow:hidden;
         display:grid; grid-template-columns:1fr 330px; grid-template-rows:auto 1fr; height:100vh; height:100dvh; -webkit-user-select:none; user-select:none; }
  /* the header floats over the map: no bar, a dark fade behind it; the map runs to the top edge under it */
  header { grid-column:1; grid-row:1; position:relative; z-index:6; display:flex; gap:6px; align-items:center; padding:4px 10px 12px;
           background:linear-gradient(#000d, #0008 60%, #0000); pointer-events:none;
           font:12px var(--mono); color:var(--dim); white-space:nowrap; min-width:0; text-shadow:0 0 3px #000, 0 0 6px #000; }
  header > * { pointer-events:auto; }
  :root { --top:calc(var(--hh, 40px) - 4px); }   /* where things pinned to the map's top go: just under the header */
  #clock { font:600 14px var(--mono); color:var(--fg); margin-right:4px; }
  #status { overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
  #status a { color:var(--dim); }
  #status .bad { color:var(--bad); }
  .srch { position:relative; }
  /* search and altitude filter: bare text fields, a faint fill only while typing */
  #q, .altf input { background:none; color:var(--fg); border:0; border-radius:4px; font:12px var(--mono); }
  #q { width:200px; padding:5px 6px; }
  #q:focus, .altf input:focus { outline:none; background:var(--alt); }
  #q::placeholder, .altf input::placeholder { color:#5a5a5e; }
  .altf { display:flex; align-items:center; gap:1px; font:11px var(--mono); color:var(--dim); white-space:nowrap; }
  .altf input { width:4.5ch; padding:5px 2px; text-align:center; }
  .altf.on, .altf.on input { color:#4fb3ff; }
  #res { position:absolute; left:0; top:calc(100% + 4px); z-index:5; width:340px; max-height:60vh; overflow:auto; background:rgba(28,28,30,.98);
         border-radius:6px; box-shadow:0 8px 24px #0008; display:none; }
  #res div { padding:7px 10px; cursor:pointer; font:12px var(--mono); color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #res div b { color:var(--fg); margin-right:6px; }
  #res div:hover, #res div.on { background:var(--soft); }
  #pick { position:fixed; z-index:20; min-width:180px; max-width:320px; padding:3px 0; background:rgba(28,28,30,.98); border:1px solid var(--line); border-radius:6px; box-shadow:0 8px 24px #0008; }
  #pick div { padding:6px 10px; cursor:pointer; font:12px var(--mono); color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pick div b { color:var(--fg); margin-right:8px; font-weight:normal; } #pick div.ac b { color:#6ee36e; }
  #pick div:hover { background:var(--soft); } #pick [data-pa] + .ac { border-top:1px solid var(--line); } #pick .more { color:var(--dim); cursor:default; }
  button { background:none; border:0; color:var(--dim); font:12px var(--mono); padding:5px 7px; border-radius:4px; cursor:pointer; }
  button:hover { color:var(--fg); background:var(--alt); }
  button.on { color:var(--fg); }
  #wrap { grid-column:1; grid-row:1 / 3; position:relative; min-height:0; min-width:0; background:#000; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
  /* scope tiles, as on atcscope: one, big + small, or an even split; each with its own view and layers */
  #tiles { position:absolute; inset:0; display:grid; gap:2px; background:#1c1c1c; }
  #tiles.one { grid-template-columns:1fr; } #tiles.one .tile + .tile { display:none; }
  #tiles.big { grid-template-columns:2fr 1fr; }
  #tiles.even { grid-template-columns:1fr 1fr; }
  @media (max-aspect-ratio: 1/1) { #tiles.big { grid-template-columns:1fr; grid-template-rows:2fr 1fr; } #tiles.even { grid-template-columns:1fr; grid-template-rows:1fr 1fr; } }
  .tile { position:relative; min-width:0; min-height:0; background:#000; overflow:hidden; }
  #tiles:not(.one) ~ .flt { bottom:auto; top:var(--top); }
  .views [data-layout] { display:flex; align-items:center; } .views [data-layout] svg { width:14px; height:14px; }
  #side { grid-column:2; grid-row:1 / 3; border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #card { flex-shrink:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:9px 10px; border-bottom:1px solid var(--line); font:12px/1.55 var(--mono); color:var(--fg2); background:var(--card); display:none; }
  #card b { color:var(--fg); font-size:13px; }
  #card a { color:#7aa2ff; text-decoration:none; }
  #card .x { float:right; padding:0 4px; }
  #card .fq { display:grid; grid-template-columns:max-content max-content 1fr; gap:0 10px; margin:5px 0; max-height:180px; overflow:auto; color:var(--dim); }
  #card .fq span:nth-child(3n+2) { color:var(--fg); }
  #card .pr { margin:5px 0; max-height:200px; overflow:auto; }
  #card .pr i { font-style:normal; color:var(--dim); display:block; margin-top:3px; }
  #card .pr span { display:inline-block; margin:1px 3px 1px 0; padding:0 5px; border:1px solid var(--line); border-radius:3px; cursor:pointer; color:var(--fg2); }
  #card .pr span.use { border-color:#6a6a6a; color:#e8e8e8; }
  #card .pr span.off { opacity:.45; }
  #card .pr span.on { border-color:#4fb3ff; color:#4fb3ff; opacity:1; }
  .atis.use b { color:#e8e8e8; font-weight:normal; }
  body.noApt.noCard, body.sideShut:not(.listOpen) { grid-template-columns:1fr; } body.noApt.noCard #side, body.sideShut:not(.listOpen) #side { display:none; }
  .views { position:absolute; left:8px; bottom:8px; z-index:2; display:flex; }
  .views button { color:#555; font-size:11px; padding:4px 6px; }
  .views button:hover, .views button.on { color:#bbb; background:none; }
  .flt { position:absolute; right:8px; bottom:8px; z-index:2; display:flex; align-items:center; color:#444; font-size:11px; }
  .flt button { color:#555; font-size:11px; padding:4px 6px; }
  .flt button:hover, .flt button.on { color:#bbb; background:none; }
  .flt.off button { color:#2e2e2e; pointer-events:none; }
  .views [data-layers] { display:flex; align-items:center; } .views [data-layers] svg { width:14px; height:14px; }
  .layers { position:absolute; left:8px; bottom:38px; z-index:3; background:var(--bg); border:1px solid var(--line); border-radius:10px;
            padding:6px 0; font:12px var(--mono); color:var(--fg2); box-shadow:0 6px 24px #0008; max-height:calc(100% - var(--top) - 46px); overflow:auto; }
  .layers[hidden] { display:none; }
  .atis { margin-top:10px; font-size:11px; line-height:1.45; color:#bdbdbd; white-space:normal; word-break:break-word; }
  .atis i { display:block; font-style:normal; color:var(--dim); margin-bottom:2px; }
  .atis i b { color:#e8e8e8; }
  .atis .dim { color:var(--dim); }
  #gnote { position:absolute; left:50%; transform:translateX(-50%); top:calc(var(--top) + 2px); z-index:2; font:11px var(--mono); color:#666; pointer-events:none; white-space:nowrap; }
  .layers h4 { margin:0; padding:9px 14px 3px; font:10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .layers h4:first-child { padding-top:3px; }
  .layers .lr { display:flex; align-items:center; }
  .layers .lr:hover { background:#1c1c1e; }
  .layers label { flex:1; display:flex; align-items:center; gap:9px; padding:5px 14px; cursor:pointer; white-space:nowrap; }
  .layers .sub label { padding-left:36px; color:var(--dim); }
  .layers .sub.off { opacity:.45; }
  .layers input { accent-color:#8e8e93; margin:0; }
  .layers .tagsz { display:flex; align-items:center; padding-right:8px; color:var(--dim); }
  .layers .tagsz button { padding:3px 7px; color:var(--dim); } .layers .tagsz b { font-weight:normal; color:var(--fg); min-width:2em; text-align:center; cursor:pointer; }
  #listBtn { display:none; }
  #srvs { display:flex; gap:0; }
  #srvs button { padding:5px 6px; } #srvs button.on { color:var(--fg); background:var(--alt); }
  #srvs button i { font-style:normal; color:var(--dim); margin-left:4px; }
  #idle { position:absolute; inset:0; z-index:4; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55);
          font:13px var(--mono); color:var(--fg2); cursor:pointer; text-align:center; padding:20px; }
  body.idle #idle { display:flex; }
  #card .au { margin:5px 0; } #card .au button { margin:1px 4px 1px 0; padding:1px 6px; font-size:11px; }
  #card .au button.on, #radioBtn { color:#30d158; } #lwBtn { color:#7aa2ff; } #card .au button.err { color:var(--bad); }
  #card .atc { display:grid; grid-template-columns:max-content 1fr max-content; gap:0 10px; margin:5px 0; color:var(--dim); }
  #card .atc span:nth-child(3n+1) { color:#5ac8fa; }
  #card .atc span:nth-child(3n+2) { color:var(--fg); overflow:hidden; text-overflow:ellipsis; }
  #card .dt { display:grid; grid-template-columns:max-content 1fr; gap:0 10px; margin:6px 0 2px; color:var(--dim); }
  #card .dt b { font-weight:normal; font-size:inherit; color:var(--fg); overflow-wrap:anywhere; }
  #card .dt i { grid-column:1 / span 2; font-style:normal; color:var(--fg2); margin-top:7px; padding-bottom:1px; border-bottom:1px solid var(--line); }
  #card .ph { display:block; margin:8px 0 2px; } #card .ph img { display:block; width:100%; max-width:360px; border-radius:6px; }
  #card .ph i { display:block; font-style:normal; font-size:10px; color:var(--dim); margin-top:2px; }
  #card .acs { margin:6px 0 2px; color:var(--dim); } #card .acs > i { display:block; font-style:normal; color:var(--fg2); margin-top:7px; padding-bottom:1px; border-bottom:1px solid var(--line); }
  #card .acx { max-height:280px; overflow:auto; } #card .acm { margin:5px 0; } #card .acm span { display:block; font-size:10px; }
  #card .acm pre { margin:1px 0 0; font:inherit; color:var(--fg); white-space:pre-wrap; overflow-wrap:anywhere; }
  #card .acs em { display:block; font-style:normal; font-size:10px; margin-top:4px; }
  #card .fp { margin:5px 0; max-height:120px; overflow:auto; color:var(--dim); white-space:normal; word-break:break-word; }
  /* timelapses: the panel (header button) and the playback bar */
  #tlBtn { display:flex; align-items:center; gap:5px; } #tlBtn svg { width:14px; height:14px; } #tlBtn.on { color:#ff9f0a; }
  #tlp { position:absolute; right:8px; top:var(--top); z-index:4; width:min(340px, calc(100% - 16px)); max-height:calc(100% - var(--top) - 8px); overflow:auto; background:var(--bg);
         border:1px solid var(--line); border-radius:10px; padding:8px 0; font:12px/1.45 var(--mono); color:var(--fg2); box-shadow:0 6px 24px #0008; }
  #tlp[hidden], #tlbar[hidden] { display:none; }
  #tlp .hd { padding:2px 12px 6px; color:var(--dim); }
  #tlp .new { display:flex; gap:6px; align-items:center; padding:0 12px 8px; border-bottom:1px solid var(--line); }
  #tlp input, #tlp select { background:var(--alt); color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:4px 6px; font:12px var(--mono); min-width:0; }
  #tlp input { flex:1; } #tlp input:focus { outline:none; border-color:#636366; }
  #tlp .go { color:#ff9f0a; } #tlp .err { color:var(--bad); padding:6px 12px 0; } #tlp .note { color:var(--dim); padding:6px 12px 0; font-size:11px; }
  #tlp .rec { display:grid; grid-template-columns:1fr auto; gap:0 6px; padding:6px 12px; border-bottom:1px solid #2a2a2c; }
  #tlp .rec:last-child { border-bottom:0; }
  #tlp .rec b { color:var(--fg); font-weight:600; } #tlp .rec i { font-style:normal; color:var(--dim); font-size:11px; grid-column:1; }
  #tlp .rec .on { color:#ff453a; } #tlp .past { border-bottom:1px solid var(--line); margin-bottom:6px; } #tlp .past select { margin-right:4px; }
  #tlp .rec div { grid-row:1 / span 2; grid-column:2; display:flex; align-items:center; }
  #tlbar { position:absolute; left:50%; transform:translateX(-50%); top:var(--top); z-index:3; display:flex; align-items:center; gap:4px; width:min(900px, calc(100% - 16px)); box-sizing:border-box;
           background:rgba(20,20,22,.92); border:1px solid var(--line); border-radius:8px; padding:3px 6px; font:11px var(--mono); color:var(--fg2); }
  #tlbar > * { flex:none; } #tlbar input[type=range] { flex:1 1 100px; min-width:60px; accent-color:#ff9f0a; }
  #tlbar .t { color:var(--fg); white-space:nowrap; } #tlbar .sp { display:flex; } #tlbar .sp button { padding:4px 4px; font-size:11px; }
  #tlbar .sp button.on { color:#ff9f0a; } #tlbar [data-tl=play] { width:3ch; color:var(--fg); }
  #tlbar .ld { color:var(--dim); white-space:nowrap; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; } #tlbar .t i { font-style:normal; } #tlbar [data-tl=x] { white-space:nowrap; } #tlbar [data-tl=tags] { color:var(--dim); } #tlbar [data-tl=tags].on { color:#ff9f0a; }
  body.tl #gnote { top:calc(var(--top) + 36px); }
  /* ATC (header button): the airports with ATC open and their inbound flights */
  #atcBtn.on { color:#5ac8fa; }
  #atcp { position:absolute; right:8px; top:var(--top); z-index:4; width:min(360px, calc(100% - 16px)); max-height:calc(100% - var(--top) - 8px); overflow:auto; background:var(--bg);
          border:1px solid var(--line); border-radius:10px; padding:8px 0; font:12px/1.45 var(--mono); color:var(--fg2); box-shadow:0 6px 24px #0008; }
  #atcp[hidden] { display:none; }
  #atcp .hd { padding:2px 12px 6px; color:var(--dim); border-bottom:1px solid var(--line); }
  #atcp .ap { display:grid; grid-template-columns:1fr auto; gap:0 8px; padding:6px 12px; border-bottom:1px solid #2a2a2c; cursor:pointer; }
  #atcp .ap:hover { background:var(--alt); }
  #atcp .ap b { color:var(--fg); font-weight:600; } #atcp .ap .n { color:var(--fg); text-align:right; } #atcp .ap .n i { font-style:normal; color:var(--dim); }
  #atcp .ap .nm { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; }
  #atcp .ap .f { grid-column:1 / span 2; color:#5ac8fa; font-size:11px; }
  #atcp .ap .go { grid-column:1 / span 2; justify-self:start; color:#5ac8fa; padding:2px 0; margin-top:2px; }
  #atcp .inb { display:grid; grid-template-columns:auto 1fr auto auto; gap:0 10px; padding:2px 12px 8px 20px; border-bottom:1px solid #2a2a2c; }
  #atcp .inb span { cursor:pointer; } #atcp .inb .cs { color:var(--fg); } #atcp .inb .d { color:var(--dim); }
  #atcp .inb .none { grid-column:1 / span 4; color:var(--dim); cursor:default; }
  #atcp .err { color:var(--dim); padding:8px 12px 0; }
  /* phones and small tablets, either way up: the side panel becomes a drawer (landscape) or a bottom sheet (portrait) */
  @media (max-width: 820px), (max-height: 500px) {
    body { grid-template-columns:1fr; }
    header { padding:3px max(8px, env(safe-area-inset-right)) 10px max(8px, env(safe-area-inset-left)); }
    #q { width:120px; } #srvs button i { display:none; } #res { width:min(340px, 90vw); }
    #status { display:none; } #tlBtn span { display:none; } #tlbar .sp button:not(:nth-child(3n)) { display:none; } #tlbar .ld, #tlbar .t i { display:none; }
    #listBtn { display:inline-block; margin-left:auto; } body.noApt #listBtn { display:none; }
    #side { position:fixed; right:0; top:var(--hh, 36px); bottom:0; width:min(330px, 50vw); z-index:3; background:rgba(28,28,30,.97); display:none;
            padding-right:env(safe-area-inset-right); }
    body.listOpen #side { display:flex; }
    .views { left:max(8px, env(safe-area-inset-left)); bottom:max(6px, env(safe-area-inset-bottom)); max-width:calc(100% - 16px); overflow-x:auto; scrollbar-width:none; }
    .views::-webkit-scrollbar { display:none; }
    .views button { padding:8px 9px; font-size:12px; }
    .layers { left:max(8px, env(safe-area-inset-left)); bottom:calc(max(6px, env(safe-area-inset-bottom)) + 40px);
              max-height:calc(100% - var(--top) - max(6px, env(safe-area-inset-bottom)) - 52px); }
    .layers label { padding:8px 16px; font-size:13px; } .layers .sub label { padding-left:40px; }
    .layers h4 { padding:11px 16px 3px; font-size:10px; }
    .layers .tagsz { font-size:13px; } .layers .tagsz button { padding:6px 10px; font-size:13px; }
    .flt { right:max(8px, env(safe-area-inset-right)); bottom:max(6px, env(safe-area-inset-bottom)); }
    .flt button { padding:8px 7px; font-size:12px; }
  }
  @media (max-width: 820px) and (max-aspect-ratio: 1/1) {
    #side { top:auto; left:0; width:auto; max-height:min(55dvh, 520px); border-left:0; border-top:1px solid var(--line); border-radius:12px 12px 0 0;
            padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-shadow:0 -8px 24px #0008; }
    /* the whole card scrolls as one inside the sheet, so no little scroll boxes inside it */
    #card .fq, #card .pr, #card .fp { max-height:none; overflow:visible; }
  }
  /* narrow phones: one header row (clock, search, ALT, buttons; servers wrap below if there are any), and ALL/ARR/DEP sits above the view buttons */
  @media (max-width: 480px) {
    header { flex-wrap:wrap; row-gap:0; gap:4px; }
    #clock { font-size:12px; margin-right:0; } .srch { flex:1 1 0; min-width:0; } #q { width:100%; }
    #listBtn { margin-left:0; } header button { padding:5px 5px; } #srvs { order:9; }
    #tiles.one ~ .flt { bottom:calc(max(6px, env(safe-area-inset-bottom)) + 36px); }
    #gnote { max-width:calc(100% - 16px); overflow:hidden; text-overflow:ellipsis; }
    #tiles:not(.one) ~ #gnote { top:calc(var(--top) + 34px); }
  }
</style>
</head>
<body>
<header>
  <span id="clock">--:--:--Z</span>
  <div class="srch"><input id="q" placeholder="Search..." title="Search: airport code or name (KSFO, LHR, Narita), or an aircraft by callsign, tail number or hex code (UAL123, N12345, a1b2c3)" autocomplete="off" spellcheck="false"><div id="res"></div></div>
  <label class="altf" id="altf" title="Altitude filter: hundreds of feet (50 = 5,000 ft), feet (5000) or FL350. Leave a box empty for no limit. Aircraft outside it are greyed out with a short tag (altitude and wake category).">ALT
    <input id="altLo" inputmode="numeric" placeholder="min" autocomplete="off" spellcheck="false">-<input id="altHi" inputmode="numeric" placeholder="max" autocomplete="off" spellcheck="false"></label>
  <span id="srvs" title="Server"></span>
  <span id="status"></span>
  <button id="lwBtn" hidden title="Close the LiveATC tab (a feed's player opened from it has its own window: close that there)"></button>
  <button id="radioBtn" hidden title="Stop the live audio"></button>
  <button id="atcBtn" hidden title="Airports with ATC open and their inbound flights">ATC</button>
  <button id="tlBtn" hidden title="Timelapses: record this area on the server and play it back sped up"></button>
  <button id="listBtn" title="The airport or aircraft card">Info</button>
</header>
<div id="wrap">
  <div id="tiles" class="one"></div>
  <div id="pick" hidden></div>
  <div id="gnote"></div>
  <div id="tlp" hidden></div>
  <div id="atcp" hidden></div>
  <div id="tlbar" hidden></div>
  <div id="idle">Paused after a while without input.<br>Tap anywhere to resume.</div>
  <div class="flt" id="flt" title="Pick an airport, then show only its arrivals and/or departures; the rest are greyed out with a short tag (altitude and wake category)">
    <button data-f="all">ALL</button><button data-f="arr">ARR</button><button data-f="dep">DEP</button><button data-f="both">ARR+DEP</button>
  </div>
</div>
<div id="side">
  <div id="card"></div>
</div>
<script>
// The shared scope client (livescope, infinitescope, ...): traffic on a STARS-style scope that zooms out to the globe.
// Watch only. server.py puts the site's settings in SITE above: name, title, links and its features
// (procs, ground, world, routes, atis); a feature a site doesn't have is skipped.
const has = f => SITE.features.includes(f);
const KEY = SITE.name;                 // localStorage prefix
// optional site settings: no_history (no trails), hist_s (seconds of trail to keep, default 32), stale_s (dead reckoning limit), idle_min (stop polling after that
// long without input), poll_ms, world_ms, start (hash to open on; null = the globe), metar_label
const STALE_S = SITE.stale_s || 20, POLL_MS = SITE.poll_ms || 2000, WORLD_MS = SITE.world_ms || 30000;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));

  const a = F[lo], b = F[lo + 1], gap = b ? b[0] - a[0] : 0, dt = t - a[0], f = gap > 0 ? Math.min(1, dt / gap) : 0;
  const bm = b && gap < 180 ? tlById(b) : null, now = Date.now() / 1000, out = [];

    let lat = la0, lon = lo0, alt = alt0, gs = gs0, hdg = hdg0;

// the world at replay time t, in OpenSky's compact form for drawWorld: each aircraft eased between snapshots

function tlWorldAt(t) {
  const F = RP.frames; let lo = 0, hi = F.length - 1;

  const a = F[lo], b = F[lo + 1], gap = b ? b[0] - a[0] : 0, dt = Math.max(0, t - a[0]), f = gap > 0 ? Math.min(1, dt / gap) : 0;

    const est = k === 2, bm = b && gap < 3600 ? (b[k + 2] || (b[k + 2] = new Map((b[k] || []).map(r => [r[0], r])))) : null, list = [];

function tlLoop() {

    if (now - RP.ing > 400) { RP.ing = now; tlBar(); $('clock').textContent = tlTime(RP.t).slice(6);
      $('status').textContent = `timelapse ${RP.rec.name} · ${WORLD.ac.filter(r => !r[8]).length.toLocaleString()} airborne worldwide` + (L.est && WORLD.est.length ? `, ${WORLD.est.length.toLocaleString()} estimated over the oceans` : '') + ' · OpenSky'; }

}
