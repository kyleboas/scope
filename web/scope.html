<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>livescope</title>
<style>
  :root { color-scheme:dark; --bg:#1c1c1e; --line:#38383a; --fg:#f2f2f7; --fg2:#c7c7cc; --dim:#98989f; --alt:#232325; --soft:#3a3a3c;
          --card:#2c2c2e; --bad:#ff6961; --mono:ui-monospace, Menlo, monospace;
          --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:12px/1.2 var(--sans); -webkit-font-smoothing:antialiased; overflow:hidden;
         display:grid; grid-template-columns:1fr 330px; grid-template-rows:auto 1fr; height:100vh; height:100dvh; -webkit-user-select:none; user-select:none; }
  header { grid-column:1/3; display:flex; gap:6px; align-items:center; padding:4px 10px; border-bottom:1px solid var(--line);
           font:12px var(--mono); color:var(--dim); white-space:nowrap; min-width:0; }
  #clock { font:600 14px var(--mono); color:var(--fg); margin-right:4px; }
  #status { overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
  #status a { color:var(--dim); }
  #status .bad { color:var(--bad); }
  .srch { position:relative; }
  #q { width:230px; background:var(--alt); color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:5px 8px; font:12px var(--mono); }
  #q:focus { outline:none; border-color:#636366; }
  .altf { display:flex; align-items:center; gap:3px; font:11px var(--mono); color:var(--dim); white-space:nowrap; }
  .altf input { width:6.5ch; background:var(--alt); color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:5px 5px; font:12px var(--mono); text-align:center; }
  .altf input:focus { outline:none; border-color:#636366; }
  .altf.on input { border-color:#4fb3ff88; }
  #res { position:absolute; left:0; top:calc(100% + 4px); z-index:5; width:340px; max-height:60vh; overflow:auto; background:rgba(28,28,30,.98);
         border-radius:6px; box-shadow:0 8px 24px #0008; display:none; }
  #res div { padding:7px 10px; cursor:pointer; font:12px var(--mono); color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #res div b { color:var(--fg); margin-right:6px; }
  #res div:hover, #res div.on { background:var(--soft); }
  button { background:none; border:0; color:var(--dim); font:12px var(--mono); padding:5px 7px; border-radius:4px; cursor:pointer; }
  button:hover { color:var(--fg); background:var(--alt); }
  button.on { color:var(--fg); }
  #wrap { position:relative; min-height:0; min-width:0; background:#000; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
  /* scope tiles, as on atcscope: one, big + small, or an even split; each with its own view and layers */
  #tiles { position:absolute; inset:0; display:grid; gap:2px; background:#1c1c1c; }
  #tiles.one { grid-template-columns:1fr; } #tiles.one .tile + .tile { display:none; }
  #tiles.big { grid-template-columns:2fr 1fr; }
  #tiles.even { grid-template-columns:1fr 1fr; }
  @media (max-aspect-ratio: 1/1) { #tiles.big { grid-template-columns:1fr; grid-template-rows:2fr 1fr; } #tiles.even { grid-template-columns:1fr; grid-template-rows:1fr 1fr; } }
  .tile { position:relative; min-width:0; min-height:0; background:#000; overflow:hidden; }
  #tiles:not(.one) ~ .flt { bottom:auto; top:8px; }
  .views [data-layout] { display:flex; align-items:center; } .views [data-layout] svg { width:14px; height:14px; }
  #side { border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #card { flex-shrink:0; padding:9px 10px; border-bottom:1px solid var(--line); font:12px/1.55 var(--mono); color:var(--fg2); background:var(--card); display:none; }
  #card b { color:var(--fg); font-size:13px; }
  #card a { color:#7aa2ff; text-decoration:none; }
  #card .x { float:right; padding:0 4px; }
  #card .fq { display:grid; grid-template-columns:max-content max-content 1fr; gap:0 10px; margin:5px 0; max-height:180px; overflow:auto; color:var(--dim); }
  #card .fq span:nth-child(3n+2) { color:var(--fg); }
  #card .pr { margin:5px 0; max-height:200px; overflow:auto; }
  #card .pr i { font-style:normal; color:var(--dim); display:block; margin-top:3px; }
  #card .pr span { display:inline-block; margin:1px 3px 1px 0; padding:0 5px; border:1px solid var(--line); border-radius:3px; cursor:pointer; color:var(--fg2); }
  #card .pr span.on { border-color:#4fb3ff; color:#4fb3ff; }
  body.noApt #list { display:none; }
  body.noApt.noCard { grid-template-columns:1fr; } body.noApt.noCard #side { display:none; }
  #list { overflow:auto; flex:1; padding:4px 0; font:11px/1.5 var(--mono); color:var(--fg2); }
  .tr { display:grid; grid-template-columns:1ch 8ch 5ch 6ch 4ch 1fr; gap:6px; padding:2px 10px; cursor:pointer; white-space:nowrap; }
  .tr:hover { background:var(--alt); } .tr.on { background:var(--soft); color:var(--fg); }
  .tr.hd { color:var(--dim); cursor:default; position:sticky; top:-4px; background:var(--bg); } .tr.hd:hover { background:var(--bg); }
  .tr.gnd { color:var(--dim); } .tr.emer { color:var(--bad); }
  .tr span:last-child { text-align:right; }
  .views { position:absolute; left:8px; bottom:8px; z-index:2; display:flex; }
  .views button { color:#555; font-size:11px; padding:4px 6px; }
  .views button:hover, .views button.on { color:#bbb; background:none; }
  .flt { position:absolute; right:8px; bottom:8px; z-index:2; display:flex; align-items:center; color:#444; font-size:11px; }
  .flt button { color:#555; font-size:11px; padding:4px 6px; }
  .flt button:hover, .flt button.on { color:#bbb; background:none; }
  .flt.off button { color:#2e2e2e; pointer-events:none; }
  .tr.dim { color:#3a3a3a; }
  .views [data-layers] { display:flex; align-items:center; } .views [data-layers] svg { width:14px; height:14px; }
  .layers { position:absolute; left:8px; bottom:38px; z-index:3; background:var(--bg); border:1px solid var(--line); border-radius:10px;
            padding:6px 0; font:12px var(--mono); color:var(--fg2); box-shadow:0 6px 24px #0008; max-height:calc(100% - 50px); overflow:auto; }
  .layers[hidden] { display:none; }
  .atis { margin-top:10px; font-size:11px; line-height:1.45; color:#bdbdbd; white-space:normal; word-break:break-word; }
  .atis i { display:block; font-style:normal; color:var(--dim); margin-bottom:2px; }
  .atis i b { color:#e8e8e8; }
  .atis .dim { color:var(--dim); }
  #gnote { position:absolute; left:50%; transform:translateX(-50%); top:10px; z-index:2; font:11px var(--mono); color:#666; pointer-events:none; white-space:nowrap; }
  .layers label { display:flex; align-items:center; gap:9px; padding:6px 14px; cursor:pointer; white-space:nowrap; }
  .layers label:hover { background:#1c1c1e; }
  .layers input { accent-color:#8e8e93; margin:0; }
  #listBtn { display:none; }
  #srvs { display:flex; gap:0; }
  #srvs button { padding:5px 6px; } #srvs button.on { color:var(--fg); background:var(--alt); }
  #srvs button i { font-style:normal; color:var(--dim); margin-left:4px; }
  #idle { position:absolute; inset:0; z-index:4; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55);
          font:13px var(--mono); color:var(--fg2); cursor:pointer; text-align:center; padding:20px; }
  body.idle #idle { display:flex; }
  #card .atc { display:grid; grid-template-columns:max-content 1fr max-content; gap:0 10px; margin:5px 0; color:var(--dim); }
  #card .atc span:nth-child(3n+1) { color:#5ac8fa; }
  #card .atc span:nth-child(3n+2) { color:var(--fg); overflow:hidden; text-overflow:ellipsis; }
  #card .fp { margin:5px 0; max-height:120px; overflow:auto; color:var(--dim); white-space:normal; word-break:break-word; }
  @media (max-width: 820px) {
    body { grid-template-columns:1fr; }
    header { grid-column:1; padding:3px max(8px, env(safe-area-inset-right)) 3px max(8px, env(safe-area-inset-left)); }
    #q { width:120px; } #srvs button i { display:none; } .altf input { width:5.5ch; } #res { width:min(340px, 90vw); }
    #status { display:none; }
    #listBtn { display:inline-block; } body.noApt #listBtn { display:none; }
    #side { position:fixed; right:0; top:var(--hh, 36px); bottom:0; width:min(330px, 88vw); z-index:3; background:rgba(28,28,30,.97); display:none; }
    body.listOpen #side { display:flex; }
    .views { left:max(8px, env(safe-area-inset-left)); bottom:max(6px, env(safe-area-inset-bottom)); }
    .views button { padding:8px 9px; font-size:12px; }
    .layers { left:max(8px, env(safe-area-inset-left)); bottom:calc(max(6px, env(safe-area-inset-bottom)) + 40px); }
    .layers label { padding:9px 16px; font-size:13px; }
    .flt { right:max(8px, env(safe-area-inset-right)); bottom:max(6px, env(safe-area-inset-bottom)); }
    .flt button { padding:8px 7px; font-size:12px; }
  }
</style>
</head>
<body>
<header>
  <span id="clock">--:--:--Z</span>
  <div class="srch"><input id="q" placeholder="Airport: KSFO, LHR, Narita…" autocomplete="off" spellcheck="false"><div id="res"></div></div>
  <label class="altf" id="altf" title="Altitude filter: hundreds of feet (50 = 5,000 ft), feet (5000) or FL350. Leave a box empty for no limit. Aircraft outside it are greyed out without tags.">ALT
    <input id="altLo" inputmode="numeric" placeholder="min" autocomplete="off" spellcheck="false">–<input id="altHi" inputmode="numeric" placeholder="max" autocomplete="off" spellcheck="false"></label>
  <span id="srvs" title="Server"></span>
  <span id="status"></span>
  <button id="listBtn">List</button>
</header>
<div id="wrap">
  <div id="tiles" class="one"></div>
  <div id="gnote"></div>
  <div id="idle">Paused after a while without input.<br>Tap anywhere to resume.</div>
  <div class="flt" id="flt" title="Pick an airport, then show only its arrivals and/or departures; the rest are greyed out without tags">
    <button data-f="all">ALL</button><button data-f="arr">ARR</button><button data-f="dep">DEP</button><button data-f="both">ARR+DEP</button>
  </div>
</div>
<div id="side">
  <div id="card"></div>
  <div id="list"></div>
</div>
<script>
// The shared scope client (livescope, infinitescope, ...): traffic on a STARS-style scope that zooms out to the globe.
// Watch only. server.py puts the site's settings in SITE above: name, title, links and its features
// (procs, ground, world, routes, atis); a feature a site doesn't have is skipped.
const has = f => SITE.features.includes(f);
const KEY = SITE.name;                 // localStorage prefix
// optional site settings: no_history (no trails), stale_s (dead reckoning limit), idle_min (stop polling after that
// long without input), poll_ms, world_ms, start (hash to open on; null = the globe), metar_label
const STALE_S = SITE.stale_s || 20, POLL_MS = SITE.poll_ms || 2000, WORLD_MS = SITE.world_ms || 30000;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));
const dpr = () => devicePixelRatio || 1;
const R_NM = 3440.065, D2R = Math.PI / 180;
const FONT = px => `bold ${px * dpr()}px ui-monospace, Menlo, Consolas, monospace`;
const COL = { coast:'#555', border:'#3a3a3a', state:'#262626', grat:'#161616', ring:'#3a3a3a', db:'#6ee36e', dbDim:'#3f8a3f', sel:'#fff',
              alert:'#ff3b30', hist:'#2c46ff', ptl:'#bdbdbd', gnd:'#8b949e', apt:'#7a7a7a', aptDim:'#4a4a4a', rwy:'#8a8a8a', cover:'#2c4a6a' };
const PROC = { star:['#2e2e2e', [2, 5]], transition:['#2e2e2e', [2, 5]], approach:['#555', null], sid:['#262626', [8, 6]] };
const PROC_HOME = { star:['#4a4a4a', [2, 5]], transition:['#4a4a4a', [2, 5]], approach:['#6a6a6a', null], sid:['#3c3c3c', [8, 6]] };
const PROC_SEL = '#4fb3ff';
// map layers, as on atcscope (the stack button, bottom left; remembered). Layers icon: Tabler Icons (MIT)
const LAYERS = [['star', 'STARs'], ['approach', 'Approaches'], ['sid', 'SIDs'], ['nearby', "Nearby airports' procedures"], ['fixes', 'Fixes'],
                ['fixnames', 'Fix names'], ['rings', 'Range rings'], ['airports', 'Airports'], ['small', 'Small airports and strips'],
                ['runways', 'Runways'], ['finals', 'Extended finals (KSFO)'], ['taxi', 'Ground maps (taxiways, aprons, gates)'], ['states', 'State and province lines'],
                ['borders', 'Borders'], ['coast', 'Coastlines'], ['atc', 'Airports with ATC on duty'], ['plan', "Selected flight's plan and flown route"], ['trails', 'History trails'], ['ptl', 'One-minute track lines'],
                ['tags', 'Data tags'], ['ground', 'Ground traffic'], ['world', 'Worldwide traffic when zoomed out'], ['est', 'Estimated positions over the oceans']];
const L_DEFAULT = { star:true, approach:true, sid:true, nearby:true, fixes:true, fixnames:true, rings:true, airports:true, small:true, runways:true,
            finals:true, taxi:true, states:true, borders:true, coast:true, atc:true, plan:true, trails:true, ptl:true, tags:true, ground:true, world:true, est:true };
const MAX_LIVE_NM = 250, HALF_MIN = 0.4, HALF_GLOBE = R_NM * 1.12;

// scope tiles (one, big + small, even split, as on atcscope): each has its own canvas, view and layers;
// use(s) points cv / ctx / map / view / drawn / L at one of them. Outside drawing and input handlers they
// point at the main scope, which also drives the feed, the URL and the list.
let cv, ctx, map, mctx, view, L, mapKey = '', drawn = [];
const scopes = [];
let active = null;                     // the scope the pointer was last in (keyboard zoom)
function use(s) { cv = s.cv; ctx = s.ctx; map = s.map; mctx = s.mctx; view = s.view; L = s.L; drawn = s.drawn; }
const ICO = { layers:'<path d="M12 4L4 8l8 4l8-4zm-8 8l8 4l8-4M4 16l8 4l8-4"/>', one:'<path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
              big:'<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm11-2v16"/>', even:'<path d="M3 4a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zm9-1v18"/>' };
const ico = n => `<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">${ICO[n]}</g></svg>`;
const LAYOUTS = ['one', 'big', 'even'];
function setLayout(m) {
  $('tiles').className = m; try { localStorage.setItem(KEY + '-tiles', m); } catch (e) {}
  const b = document.querySelector('[data-layout]'); b.innerHTML = ico(m); b.title = 'Scope layout: one / big + small / even split (click to change)';
  requestAnimationFrame(resize);
}
function makeScope(v) {
  const el = document.createElement('div'), n = scopes.length; el.className = 'tile';
  el.innerHTML = `<canvas></canvas><div class="layers" hidden></div><div class="views">${n ? '' : '<button data-layout></button>'}` +
    `<button data-layers title="Layers" aria-label="Layers">${ico('layers')}</button>` +
    '<button data-v="0.8">GND</button><button data-v="3">FLD</button><button data-v="40">APP</button><button data-v="250">CTR</button><button data-v="globe">GLOBE</button></div>';
  $('tiles').appendChild(el);
  const c = el.querySelector('canvas'), m = document.createElement('canvas');
  const s = { el, n, cv:c, ctx:c.getContext('2d'), map:m, mctx:m.getContext('2d'), view:{ ...v }, L:{ ...L_DEFAULT }, drawn:[], key:'' };
  const lkey = KEY + '-layers' + (n ? '-' + n : '');
  try { Object.assign(s.L, JSON.parse(localStorage.getItem(lkey) || '{}')); } catch (e) {}
  const lp = el.querySelector('.layers');
  lp.innerHTML = LAYERS.filter(([k]) => (has('world') || (k !== 'world' && k !== 'est')) && (has('atc') || k !== 'atc') && (has('flight') || k !== 'plan') && !(SITE.no_history && k === 'trails') && !(has('flight') && k === 'est')).map(([k, t]) => `<label><input type="checkbox" data-l="${k}"${s.L[k] ? ' checked' : ''}><span>${t}</span></label>`).join('');
  lp.addEventListener('change', e => { s.L[e.target.dataset.l] = e.target.checked; s.key = ''; worldPtsT = 0; loadWorld(); loadGround();
    try { localStorage.setItem(lkey, JSON.stringify(s.L)); } catch (err) {} });
  el.querySelector('[data-layers]').onclick = () => { lp.hidden = !lp.hidden; };
  document.addEventListener('pointerdown', e => { if (!lp.hidden && !lp.contains(e.target) && !e.target.closest('[data-layers]')) lp.hidden = true; });
  if (!n) el.querySelector('[data-layout]').onclick = () => setLayout(LAYOUTS[(LAYOUTS.indexOf($('tiles').className) + 1) % LAYOUTS.length]);
  el.querySelectorAll('.views [data-v]').forEach(b => b.onclick = () => {
    use(s); const v = b.dataset.v; view.half = v === 'globe' ? R_NM * 1.05 : +v;
    if (v !== 'globe' && home && gc(view.lat, view.lon, home[5], home[6]) < 600) { view.lat = home[5]; view.lon = home[6]; }
    viewChanged(true); use(scopes[0]);
  });
  scopes.push(s); return s;
}
// every scope's canvas gets the handler, run with that scope in use
function eachScope(fn) { const out = []; for (const s of scopes) if (s.el.offsetWidth) { use(s); out.push(fn(s)); } use(scopes[0]); return out; }
function onCv(type, fn, opts) {
  for (const s of scopes) s.cv.addEventListener(type, e => { use(s); active = s; try { fn(e); } finally { s.drawn = drawn; use(scopes[0]); } }, opts);
}
let home = null;                       // the airport picked (range rings): [ident, iata, name, city, country, lat, lon, elev, kind]
let S = null, sel = null, hover = null;
const liveOff = new Map(), hist = new Map();
let LINES = null, MAJOR = [], KSFO = null;
const areaAps = new Map();             // ident -> airport with runways, near where you've looked
const procs = new Map();               // ident -> {p: [[kind, name, transition, pts, missed]], f: {fix: [lat, lon]}} (US, FAA CIFP)
let procSel = null;                    // [airport, kind, name] of the procedure picked in the airport card

// ------------------------------------------------------------------ geometry: orthographic globe centred on the view
let P0 = { sl:0, cl:1, lon:0, k:1, w:0, h:0 };
function setFrame() {
  P0 = { sl:Math.sin(view.lat * D2R), cl:Math.cos(view.lat * D2R), lon:view.lon * D2R, w:cv.width, h:cv.height,
         k:Math.min(cv.width, cv.height) / (2 * view.half) * R_NM };
}
// sin/cos of the latitude are passed in so the map lines can precompute them
function projSC(sp, cp, lam) {
  const dl = lam - P0.lon, cd = Math.cos(dl);
  const cosc = P0.sl * sp + P0.cl * cp * cd;
  return [P0.w / 2 + cp * Math.sin(dl) * P0.k, P0.h / 2 - (P0.cl * sp - P0.sl * cp * cd) * P0.k, cosc];
}
function proj(lat, lon) { const p = lat * D2R; return projSC(Math.sin(p), Math.cos(p), lon * D2R); }
function unproj(sx, sy) {
  const x = (sx - P0.w / 2) / P0.k, y = -(sy - P0.h / 2) / P0.k, rho = Math.hypot(x, y);
  if (rho > 1) return null;
  if (rho < 1e-12) return [view.lat, view.lon];
  const c = Math.asin(rho), sc = Math.sin(c), cc = Math.cos(c);
  const lat = Math.asin(cc * P0.sl + y * sc * P0.cl / rho);
  const lon = P0.lon + Math.atan2(x * sc, rho * P0.cl * cc - y * P0.sl * sc);
  return [lat / D2R, ((lon / D2R) + 540) % 360 - 180];
}
function dest(lat, lon, brg, nm) {
  const d = nm / R_NM, b = brg * D2R, p1 = lat * D2R, l1 = lon * D2R;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(b));
  const l2 = l1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
  return [p2 / D2R, ((l2 / D2R) + 540) % 360 - 180];
}
function gc(lat1, lon1, lat2, lon2) {
  const p1 = lat1 * D2R, p2 = lat2 * D2R, dl = (lon2 - lon1) * D2R;
  const h = Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R_NM * Math.asin(Math.min(1, Math.sqrt(h)));
}
const viewNm = () => view.half * Math.hypot(cv.width, cv.height) / Math.min(cv.width, cv.height);   // centre to corner
const pxPerNm = () => Math.min(cv.width, cv.height) / (2 * view.half);

// a polyline in [lat, lon] pairs, broken where it goes behind the globe
function geoLine(c, pts, color, dash, w) {
  c.strokeStyle = color; c.lineWidth = (w || 1) * dpr(); c.setLineDash(dash ? dash.map(v => v * dpr()) : []);
  c.beginPath(); let pen = false;
  for (const [la, lo] of pts) { const [x, y, z] = proj(la, lo); if (z < 0) { pen = false; continue; } pen ? c.lineTo(x, y) : c.moveTo(x, y); pen = true; }
  c.stroke(); c.setLineDash([]);
}
function geoCircle(c, lat, lon, nm, color, dash) {
  const pts = []; for (let b = 0; b <= 360; b += 3) pts.push(dest(lat, lon, b, nm)); geoLine(c, pts, color, dash);

// ------------------------------------------------------------------ map layer (redrawn only when the view moves)
